<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Appli mobile une colonne, en-tête collant, onglets en bas, feuilles modales. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#16202B; --muted:#5D6A77; --line:#D8DEE5;
  --accent:#1F5E52; --accent-ink:#FFFFFF; --accent-soft:#DCEBE6;
  --warn:#A86C12; --warn-soft:#F6EAD3; --bad:#B4432F; --bad-soft:#F6DDD7; --good:#2E7A4D;
  --c1:#2F7D6B; --c2:#C0613A; --c3:#3D6FB0; --c4:#6B5BA8; --c5:#B8862B; --c6:#B34A7A; --c7:#4E8A3A; --c8:#5B6B7C;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(22,32,43,.05),0 6px 20px rgba(22,32,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E141A; --surface:#17202A; --sunk:#121A22; --ink:#E5EAEF; --muted:#93A1AE; --line:#29343F;
  --accent:#6CC2AE; --accent-ink:#0B201B; --accent-soft:#1B3832;
  --warn:#E2AA4C; --warn-soft:#3A2D16; --bad:#EC8670; --bad-soft:#3E231E; --good:#6FCB92;
  --c1:#62BBA6; --c2:#E58C64; --c3:#77A3E0; --c4:#A595E0; --c5:#E0B357; --c6:#E07FAD; --c7:#8AC572; --c8:#98A8B8;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px}
.month{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.month h1{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0 6px;white-space:nowrap;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.icon-btn:disabled{opacity:.3}
.icon-btn svg{width:20px;height:20px}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.big{font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:-.02em;line-height:1.1}
.muted{color:var(--muted)}
.small{font-size:13px}

.hero{display:flex;align-items:center;gap:18px}
.ring{width:124px;height:124px;flex:none}
.ring-wrap{position:relative;flex:none}
.ring-wrap .ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--f-display);font-size:22px}
.hero-txt{min-width:0;display:flex;flex-direction:column;gap:6px}

.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.cat-name{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.dot{width:10px;height:10px;border-radius:4px;flex:none}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.bar .m50,.bar .m80{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.bar .m50{left:50%}.bar .m80{left:80%}
.cats{display:flex;flex-direction:column;gap:14px}
.fixed-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500}
.alert b{font-weight:700}
.alert.amber{background:var(--warn-soft);color:var(--warn)}
.alert.red{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--accent-soft);color:var(--accent)}
.alert .tag{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.box b{font-family:var(--f-display);font-size:20px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.list>.item:first-child{border-top:0}
.item .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;color:#fff}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:12.5px;color:var(--muted)}
.item .am{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item .am small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:4px;vertical-align:1px}
.chip.auto{background:var(--sunk);color:var(--muted)}
.day-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize;padding-top:8px}

.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Filtre par catégorie : rangée de pastilles qui défile horizontalement */
.cat-chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chips button{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid transparent;background:var(--surface);box-shadow:var(--shadow);border-radius:99px;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap}
.cat-chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cat-row.go{cursor:pointer;border-radius:8px}
.cat-row.go:active{opacity:.6}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
/* Recherche */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:4px 6px 4px 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:9px 0;font-size:16px;outline:none}
.search input::-webkit-search-cancel-button{display:none}
/* Divers v3 */
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.kebab svg{width:20px;height:20px}
.danger-link{color:var(--bad);display:block;margin:2px 0 10px;font-size:14px}
/* Bouton supprimer */
.del-btn{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--bad);border:1.5px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.del-btn.sure{background:var(--bad);color:#fff;border-color:var(--bad);animation:pop .32s cubic-bezier(.2,.9,.25,1)}
/* Sélecteur à pastille glissante */
.seg.pill-seg{position:relative}
.seg.pill-seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 6px);border-radius:9px;background:var(--accent);transition:transform .4s cubic-bezier(.2,.9,.25,1);pointer-events:none}
.seg.pill-seg.right .pill{transform:translateX(calc(100% + 4px))}
.seg.pill-seg button{position:relative;z-index:1;transition:color .3s ease}
.seg.pill-seg button[aria-pressed="true"]{background:none;color:var(--accent-ink)}
/* Blocs qui se replient en douceur */
.collapse{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .4s cubic-bezier(.2,.9,.25,1),opacity .3s ease}
.collapse>div{overflow:hidden;min-height:0}
.collapse.closed{grid-template-rows:0fr;opacity:0}
#sheetForm .amount-inp{transition:color .3s ease}
#sheetForm.inc .amount-inp{color:var(--good)}
/* Poignée de la fenêtre (glisser pour fermer) */
.grip-zone{position:sticky;top:-10px;z-index:3;margin:-10px -16px 0;padding:10px 0 12px;background:var(--surface);cursor:grab;touch-action:none}
.grip-zone .grip{margin:0 auto}
.edit-row.moved{animation:pop .35s cubic-bezier(.2,.9,.25,1)}
#dc{transform-origin:100px 100px}
#dc.dc-anim{animation:dcIn .35s cubic-bezier(.2,.9,.25,1) both}
.off-b{background:var(--warn-soft);color:var(--warn);margin-bottom:14px}
.bilan-b{background:var(--accent);color:var(--accent-ink)}
.bilan-b .btn.primary{background:var(--accent-ink);color:var(--accent)}
.bilan-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft)}
.bilan-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:6px 0 4px}
.bilan-hero b{font-family:var(--f-display);font-size:40px;line-height:1.1}
.cmp{font-weight:700;font-size:12.5px;white-space:nowrap}
.cmp.up{color:var(--good)} .cmp.down{color:var(--bad)}
.pot-plan{color:var(--accent)}
.small-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
/* Barre de tri */
.sortbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sortbar span{margin-right:2px}
.sortbar button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.sortbar button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#view.a-soft .sortbar button[aria-pressed="true"]{animation:pop .32s cubic-bezier(.2,.9,.25,1) both}
.cl-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cl-actions .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px}
.cl-actions .btn span{font-size:12px;font-weight:500;color:var(--muted)}
.cl-actions .btn:disabled{opacity:.45}
/* Écran « à classer » */
.cl-hero{text-align:center;padding:10px 0 18px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cl-name{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.01em;word-break:break-word;text-wrap:balance}
.cl-amount{font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--accent);line-height:1.1}
.cl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cl-tile{display:flex;align-items:center;gap:10px;min-height:58px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;text-align:left;color:var(--ink);transition:transform .1s,background .15s}
.cl-tile .dot{width:14px;height:14px;border-radius:5px}
.cl-tile:active{transform:scale(.97);background:color-mix(in srgb,var(--tc) 18%,var(--surface));border-color:var(--tc)}
/* Camembert de répartition */
.donut{display:flex;flex-direction:column;align-items:center;gap:14px}
.donut svg{width:min(230px,70vw);height:auto;overflow:visible}
.lg{width:100%;display:flex;flex-direction:column}
.lg-row{display:grid;grid-template-columns:auto 1fr auto 46px;align-items:center;gap:10px;padding:9px 6px;border:0;border-top:1px solid var(--line);background:none;text-align:left;border-radius:8px}
.lg-row:first-child{border-top:0}
.lg-row.on{background:var(--sunk)}
.lg-n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-a{color:var(--muted);font-size:13.5px}
.lg-p{text-align:right}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:0}
.pct{font-weight:700}
.pct.amber{color:var(--warn)}.pct.red{color:var(--bad)}.pct.ok{color:inherit}
svg text{font-family:var(--f-body)}

.pot{display:flex;flex-direction:column;gap:10px}
.pot-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pot-h h3{font-family:var(--f-display);font-size:19px;margin:0;font-weight:700}
.pot .bar{height:12px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{justify-self:center;width:56px;height:56px;border-radius:19px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);transform:translateY(-10px)}
.fab svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .42s cubic-bezier(.2,.9,.25,1) both}
.sheet-in{max-width:480px;margin:0 auto}
/* ---------- Animations ---------- */
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes vIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes vR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes vSoft{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes swapIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes ringIn{from{stroke-dasharray:0 400}}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.03)}100%{transform:none}}
@keyframes dcIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes tIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.scrim{animation:fadeIn .3s ease both}
.scrim.closing{animation:fadeOut .24s ease both}
.sheet.closing{animation:sheetDown .26s cubic-bezier(.5,0,.75,0) both}
#sheetBody.swap{animation:swapIn .34s cubic-bezier(.22,.9,.3,1) both}
#view.a-fade .stack>*{animation:vIn .45s cubic-bezier(.22,.9,.3,1) both}
#view.a-fade .stack>*:nth-child(2){animation-delay:.04s}
#view.a-fade .stack>*:nth-child(3){animation-delay:.08s}
#view.a-fade .stack>*:nth-child(4){animation-delay:.12s}
#view.a-fade .stack>*:nth-child(5){animation-delay:.16s}
#view.a-fade .stack>*:nth-child(6){animation-delay:.2s}
#view.a-fade .stack>*:nth-child(n+7){animation-delay:.24s}
#view.a-left>.stack{animation:vL .38s cubic-bezier(.22,.9,.3,1) both}
#view.a-right>.stack{animation:vR .38s cubic-bezier(.22,.9,.3,1) both}
#view.a-soft .stack>section,#view.a-soft .stack>.empty{animation:vSoft .3s ease both}
#view.a-soft .seg button[aria-pressed="true"],#view.a-soft .cat-chips button[aria-pressed="true"]{animation:pop .32s cubic-bezier(.2,.9,.25,1) both}
#view.a-fade .bar i,#view.a-left .bar i,#view.a-right .bar i{animation:grow .8s cubic-bezier(.22,.9,.3,1) .12s both}
#view.a-fade .ring circle+circle,#view.a-left .ring circle+circle,#view.a-right .ring circle+circle{animation:ringIn 1s cubic-bezier(.22,.9,.3,1) .12s both}
.t-anim{animation:tIn .32s cubic-bezier(.22,.9,.3,1) both}
/* Retour au toucher, comme une appli native */
.btn,.icon-btn,.item,.link,.seg button,.cat-chips button,.choices span,.lg-row,.cl-tile,.cat-row.go,.toggle{transition:transform .16s cubic-bezier(.2,.9,.25,1),background-color .2s,color .2s,opacity .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.btn:active,.icon-btn:active,.seg button:active,.cat-chips button:active,.choices span:active,.lg-row:active,.link:active{transform:scale(.96)}
.item:active,.cat-row.go:active{transform:scale(.985);opacity:.75}
.toggle:active{transform:scale(.99)}
.fab{transition:transform .22s cubic-bezier(.2,.9,.25,1),box-shadow .22s}
.fab:active{transform:translateY(-10px) scale(.9)}
.tab{transition:color .2s}
.tab svg{transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.tab[aria-current="page"] svg{transform:translateY(-2px) scale(1.1)}
.toast{transition:opacity .3s ease,transform .35s cubic-bezier(.2,.9,.25,1)}
.toast.hide{opacity:0;transform:translate(-50%,14px)}
#searchBar{margin-bottom:14px}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--f-display);font-size:22px;margin:0 0 14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 12px;font-size:16px}
.inp:focus{border-color:var(--accent);outline:none}
/* iPhone : le champ date natif impose sa propre largeur et déborde ; on le neutralise */
.field{min-width:0}
input[type="date"].inp{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:46px;text-align:left}
input[type="date"].inp::-webkit-date-and-time-value{text-align:left;margin:0}
.amount-inp{font-family:var(--f-display);font-size:34px;font-weight:700;text-align:center;border:0;background:none;padding:4px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{position:relative}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices span{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:11px;background:var(--sunk);border:1.5px solid transparent;font-weight:600;font-size:14px;cursor:pointer}
.choices input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:var(--sunk);margin-bottom:14px;cursor:pointer}
.sw{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
.sheet-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px}

.edit-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.edit-row b{flex:1}
.edit-row.off b{color:var(--muted);font-weight:500}

.set-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set-head+.set-row,.card-h+.set-row{border-top:0}
.set-row .nm{flex:1;min-width:0;font-weight:600}
.set-row input.inp{width:92px;padding:8px 10px;text-align:right}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;padding:22px 8px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px;font-size:14px;font-weight:600}

<script>
// =====================================================================
// CONFIGURATION : colle ici les deux valeurs de Supabase > Project Settings > API
// =====================================================================
const SUPABASE_URL = 'https://sxywpptngtgpptetmhdl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_43B3rz_EKEwCs6hAoCvgrg_iHB-CcEj';

// ---------- Constantes ----------
const WIDGETS = {
  reste: 'Reste à dépenser', alertes: 'Alertes', categories: 'Catégories', semaines: 'Semaines du mois',
  epargne: 'Épargne du mois', commun: 'Dépenses communes', cagnottes: 'Cagnottes', recent: 'Dernières dépenses'
};
const DEFAULT_CATS = [['Courses', 1, false], ['Loisirs', 2, false], ['Transports', 3, false], ['Obligatoires', 4, true], ['Abonnements', 5, true], ['Cadeaux', 6, false]];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

// ---------- État ----------
let sb = null, ME = null;   // client Supabase, utilisateur connecté
let S = null;               // toutes les données chargées
const UI = { sort: 'date-desc', sortSearch: 'rel', tab: 'home', ym: todayStr().slice(0, 7), filter: 'all', catFilter: 'all', listMode: 'exp', editHome: false, q: '', offline: false, donutSel: null };

// ---------- Outils ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: Number.isInteger(Math.round(n * 100) / 100) ? 0 : 2, maximumFractionDigits: 2 }).format(n || 0);
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const shiftMonth = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); };
const dayLabel = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); };
const num = v => parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.'));
const share = e => e.shared ? e.amount / 2 : e.amount;             // ma part : moitié si commune
const level = p => p >= 0.8 ? 'red' : p >= 0.5 ? 'amber' : 'ok';
const lvlColor = p => p >= 0.8 ? 'var(--bad)' : p >= 0.5 ? 'var(--warn)' : 'var(--accent)';
const NONE = { id: 'none', name: 'Sans catégorie', budget: 0, color: 8, fixed: false };
const cat = id => S.cats.find(c => c.id === id) || NONE;
const col = c => `var(--c${c.color || 8})`;
const partnerName = () => S.partner ? (S.partner.name || 'ton/ta partenaire') : 'ton/ta partenaire';
const potTotal = p => S.contribs.filter(c => c.pot_id === p.id).reduce((s, c) => s + c.amount, 0);
const monthDiff = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const lastDay = ym => ym + '-' + pad(daysIn(ym));
const monthName = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long' }); };
const deMonth = ym => (/^[aeiouy]/i.test(monthName(ym)) ? 'd’' : 'de ') + monthName(ym);

// Budget d'une catégorie pour un mois : dernier budget fixé à partir de ce mois ou avant, sinon budget de base
function budgetFor(c, ym) {
  const h = c.budget_history || {};
  const k = Object.keys(h).filter(x => x <= ym).sort().pop();
  return k ? +h[k] : (+c.budget || 0);
}

// ---------- Recherche « intelligente » ----------
// Normalise : minuscules, sans accents, sans ponctuation (« Tax'Idriss » → « taxidriss »)
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const compact = s => norm(s).replace(/ /g, '');
// Familles de mots : [mots génériques], [enseignes]
// Chercher un mot générique (« taxi ») trouve aussi les enseignes (« Uber ») ; chercher une enseigne ne trouve qu'elle.
const SYN = [
  [['taxi', 'vtc'], ['uber', 'bolt', 'heetch', 'g7', 'freenow', 'lecab']],
  [['courses', 'supermarche', 'supermarché'], ['carrefour', 'leclerc', 'auchan', 'intermarche', 'lidl', 'aldi', 'monoprix', 'franprix', 'superu', 'hyperu', 'picard', 'netto', 'biocoop', 'grandfrais']],
  [['essence', 'carburant', 'gasoil', 'plein'], ['total', 'totalenergies', 'esso', 'shell', 'bp', 'avia', 'agip']],
  [['restaurant', 'resto', 'restau'], ['mcdonald', 'mcdo', 'burgerking', 'kfc', 'subway', 'pizza', 'sushi', 'kebab', 'brasserie', 'ubereats', 'deliveroo', 'justeat']],
  [['train'], ['sncf', 'ouigo', 'tgv', 'trainline', 'transilien']],
  [['bus', 'metro', 'tram'], ['ratp', 'navigo']],
  [['avion', 'vol'], ['airfrance', 'easyjet', 'ryanair', 'transavia', 'volotea', 'vueling']],
  [['abonnement', 'streaming'], ['netflix', 'spotify', 'deezer', 'disney', 'primevideo', 'amazonprime', 'applemusic', 'icloud', 'youtube']],
  [['sante', 'pharmacie', 'medecin', 'docteur'], ['dentiste', 'mutuelle', 'kine', 'doctolib']],
  [['boulangerie', 'pain'], ['boulanger', 'patisserie', 'viennoiserie']],
  [['cafe'], ['starbucks', 'columbus']],
  [['cinema', 'cine'], ['pathe', 'gaumont', 'ugc', 'mk2']],
  [['parking'], ['stationnement', 'indigo', 'onepark', 'effia']],
  [['vetement', 'vetements', 'habits'], ['zara', 'uniqlo', 'kiabi', 'celio', 'nike', 'adidas']],
  [['sport'], ['padel', 'fitness', 'basicfit', 'decathlon']]
];
// Distance d'édition (fautes de frappe)
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
  {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    // lettres inversées (« trian » → « train ») : une seule faute
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
// Famille de mots d'un terme saisi (mot exact, ou petite faute sur un mot d'au moins 5 lettres)
function family(t) {
  const g = SYN.find(([gen]) => gen.some(w => w === t || (t.length >= 5 && lev(t, w) <= 1) || (t.length >= 4 && w.startsWith(t) && w.length - t.length <= 2)));
  return g ? [...g[0], ...g[1]] : null;
}
// Score d'un terme dans une dépense (0 = absent). Les correspondances exactes passent devant les approximatives.
function termScore(t, P) {
  if (P.words.includes(t)) return 100;                                   // mot entier : « taxi » dans « Taxi Driss »
  if (P.words.some(w => w.startsWith(t))) return 85;                     // début de mot : « carre » → « Carrefour »
  if (t.length >= 3 && P.comp.includes(t)) return 75;                    // mot collé : « taxi » dans « JoeTaxi », « Tax'Idriss »
  if (P.cat.includes(t) || (t.length >= 3 && P.catWords.some(w => w.startsWith(t)))) return 55;   // nom de catégorie
  if (t.length >= 5) {                                                   // faute de frappe sur un mot entier (5 lettres et plus)
    const tol = t.length >= 8 ? 2 : 1;
    if (P.words.some(w => Math.abs(w.length - t.length) <= tol && lev(t, w) <= tol)) return 45;
    if (t.length >= 5 && P.words.some(w => w.length > t.length && lev(t, w.slice(0, t.length)) <= 1)) return 40;
  }
  return 0;
}
// Score par la famille de mots (synonymes : correspondance exacte uniquement, pas d'approximation)
function synScore(fam, t, P) {
  let best = 0;
  fam.forEach(w => {
    if (w === t) return;
    if (P.words.includes(w)) best = Math.max(best, 70);
    else if (w.length >= 4 && P.comp.includes(w)) best = Math.max(best, 65);
    else if (P.catWords.includes(w)) best = Math.max(best, 50);
  });
  return best;
}
// Analyse de la saisie : mots + montants (« 38 », « 12,50 », « 38€ »)
function parseQuery(q) {
  const nums = [], words = [];
  q.trim().split(/\s+/).forEach(tok => {
    const m = tok.replace(/€/g, '').match(/^(\d+(?:[.,]\d{1,2})?)$/);
    if (m) nums.push(parseFloat(m[1].replace(',', '.')));
    else norm(tok).split(' ').filter(Boolean).forEach(w => words.push(w));
  });
  return { words, nums };
}
// Tranche de montant automatique, proportionnelle à la somme cherchée
const amountRange = a => { const tol = a < 10 ? 1.5 : Math.max(1.5, a * .15); return [Math.max(0, a - tol), a + tol]; };
// Recherche : chaque mot doit être trouvé ; résultats triés par pertinence puis par date
function runSearch(q) {
  const { words, nums } = parseQuery(q);
  const fams = words.map(family);
  const ranges = nums.map(amountRange);
  const out = [];
  S.exps.forEach(e => {
    let score = 0;
    if (ranges.length) {
      const r = ranges.findIndex(([lo, hi]) => e.amount >= lo && e.amount <= hi);
      if (r < 0) return;
      const [lo, hi] = ranges[r], mid = nums[r];
      score += 60 - 40 * Math.abs(e.amount - mid) / Math.max(.01, (hi - lo) / 2);
    }
    if (words.length) {
      const c = cat(e.cat), P = { words: norm(e.label).split(' ').filter(Boolean), comp: compact(e.label), cat: norm(c.name + ' ' + (e.category_name || '')) };
      P.catWords = P.cat.split(' ').filter(Boolean);
      for (let i = 0; i < words.length; i++) {
        const sc = Math.max(termScore(words[i], P), fams[i] ? synScore(fams[i], words[i], P) : 0);
        if (!sc) return;
        score += sc;
      }
    }
    out.push({ e, score });
  });
  out.sort((a, b) => b.score - a.score || b.e.date.localeCompare(a.e.date));
  return { res: out.map(x => x.e), words, nums, ranges, fams };
}

// ---------- Hors ligne : file d'attente des ajouts ----------
const OUTBOX = 'cb-outbox', CACHE = 'cb-cache';
const outbox = () => { try { return JSON.parse(localStorage.getItem(OUTBOX)) || []; } catch (e) { return []; } };
const setOutbox = a => { try { localStorage.setItem(OUTBOX, JSON.stringify(a)); } catch (e) {} };
const isNetErr = err => !navigator.onLine || /fetch|network|load failed|timed? ?out/i.test(String(err?.message || err));
// Ajoute une ligne ; sans réseau, la met en attente et l'affiche tout de suite
async function insertOrQueue(table, row, okMsg) {
  if (navigator.onLine) {
    const { data, error } = await sb.from(table).insert(row).select().single();
    if (!error) {
      if (data && table === 'expenses') S.exps.push({ ...data, amount: +data.amount, cat: data.category_id && S.cats.some(c => c.id === data.category_id) ? data.category_id : 'none', mine: true, paidByMe: data.paid_by === ME.id });
      if (data && table === 'incomes') S.incs.push({ ...data, amount: +data.amount });
      render(); if (okMsg) toast(okMsg); refresh(); return true;
    }
    if (!isNetErr(error)) { toast('Erreur : ' + error.message); return false; }
  }
  setOutbox([...outbox(), { tmp: 'tmp-' + Date.now() + Math.random().toString(36).slice(2, 6), table, row }]);
  UI.offline = true; applyOutbox(); render();
  toast('Hors ligne : enregistrée sur ton téléphone, envoi automatique au retour du réseau');
  return true;
}
// Ajoute à l'affichage les éléments encore en attente d'envoi
function applyOutbox() {
  if (!S) return;
  S.exps = S.exps.filter(e => !e.pending); S.incs = S.incs.filter(i => !i.pending);
  outbox().forEach(o => {
    if (o.table === 'expenses') S.exps.push({ ...o.row, id: o.tmp, amount: +o.row.amount, cat: o.row.category_id || 'none', mine: true, paidByMe: o.row.paid_by === ME.id, pending: true, created_at: '' });
    if (o.table === 'incomes') S.incs.push({ ...o.row, id: o.tmp, amount: +o.row.amount, pending: true });
  });
}
// Envoie la file d'attente dès que le réseau revient
let flushing = false;
async function flush() {
  if (flushing || !navigator.onLine || !sb || !ME) return;
  const q = outbox(); if (!q.length) return;
  flushing = true; let sent = 0;
  for (const o of q) {
    const { error } = await sb.from(o.table).insert(o.row);
    if (error && isNetErr(error)) break;
    setOutbox(outbox().filter(x => x.tmp !== o.tmp)); if (!error) sent++;
  }
  flushing = false;
  if (sent) { await refresh(); toast(sent + ' élément' + (sent > 1 ? 's' : '') + ' envoyé' + (sent > 1 ? 's' : '') + ' depuis le mode hors ligne'); }
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; clearTimeout(toast.t);
  if (t.hidden) { t.classList.add('hide'); t.hidden = false; void t.offsetWidth; }
  t.classList.remove('hide');
  toast.t = setTimeout(() => { t.classList.add('hide'); toast.t = setTimeout(() => { t.hidden = true; }, 320); }, 2600);
}

// Rechargement en arrière-plan (un seul à la fois, regroupé)
let refreshing = null, refreshAgain = false;
function refresh() {
  if (!sb || !ME) return Promise.resolve();
  if (refreshing) { refreshAgain = true; return refreshing; }
  refreshing = load().then(() => render()).catch(() => {}).finally(() => { refreshing = null; if (refreshAgain) { refreshAgain = false; refresh(); } });
  return refreshing;
}
// Exécute une requête Supabase ; affichage mis à jour tout de suite (patch local), puis rechargement en arrière-plan
async function db(query, okMsg, patch) {
  if (!navigator.onLine) { toast('Pas de réseau : cette action sera possible une fois reconnecté'); return false; }
  const { error } = await query;
  if (error) { toast(isNetErr(error) ? 'Pas de réseau : réessaie dans un instant' : /budget_history|deadline/.test(error.message) ? 'Mise à jour Supabase manquante : exécute le script maj-v3.sql' : 'Erreur : ' + error.message); return false; }
  if (patch) { try { patch(); } catch (e) {} }
  render(); if (okMsg) toast(okMsg);
  refresh();
  return true;
}

// ---------- Chargement des données ----------
async function load() {
  const uid = ME.id;
  const q = t => sb.from(t).select('*');
  const [pidRes, ...res] = await Promise.all([sb.rpc('partner_id'), sb.from('profiles').select('id,email,name,partner_email,settings,created_at'),q('categories').order('position'), q('expenses'), q('incomes'), q('subscriptions'), q('pots').order('created_at'), q('pot_contribs'), q('settlements')]);
  const bad = res.find(r => r.error); if (bad) throw bad.error;
  const pid = pidRes.data || null;
  const [pr, ca, ex, inc, su, po, co, se] = res.map(r => r.data);
  const N = a => a.map(x => ({ ...x, amount: +x.amount }));
  const cats = ca.map(c => ({ ...c, budget: +c.budget, budget_history: c.budget_history || {} }));
  // Range une dépense dans MA catégorie : par id si c'est la mienne, sinon par nom
  const resolve = e => {
    if (e.user_id === uid && e.category_id && cats.some(c => c.id === e.category_id)) return e.category_id;
    const m = cats.find(c => c.name.trim().toLowerCase() === (e.category_name || '').trim().toLowerCase());
    return m ? m.id : 'none';
  };
  const profile = pr.find(p => p.id === uid);
  const st = profile.settings || {};
  S = {
    pid, profile, partner: pr.find(p => p.id === pid) || null, cats,
    exps: N(ex).map(e => ({ ...e, cat: resolve(e), mine: e.user_id === uid, paidByMe: e.paid_by === uid })),
    incs: N(inc), subs: N(su), pots: po.map(p => ({ ...p, target: +p.target })), contribs: N(co), setts: N(se),
    widgets: (st.widgets || Object.keys(WIDGETS)).filter(k => WIDGETS[k]).concat(Object.keys(WIDGETS).filter(k => !(st.widgets || Object.keys(WIDGETS)).includes(k))),
    hidden: st.hidden || [], bilanSeen: st.bilanSeen || null, clIgnored: st.clIgnored || []
  };
  // Premier lancement : création des catégories par défaut
  if (!cats.length) {
    await sb.from('categories').insert(DEFAULT_CATS.map(([name, color, fixed], i) => ({ name, color, fixed, budget: 0, position: i })));
    return load();
  }
  UI.offline = false;
  // Copie locale pour pouvoir ouvrir l'appli sans réseau
  try { localStorage.setItem(CACHE, JSON.stringify({ uid, S })); } catch (e) {}
  applyOutbox();
}

// Abonnements : ajoutés automatiquement le jour du débit, à partir du mois de création
function subsFor(ym) {
  const t = todayStr();
  return S.subs.filter(s => s.start_date.slice(0, 7) <= ym).map(s => ({
    id: 'sub-' + s.id + '-' + ym, date: ym + '-' + pad(Math.min(s.day, daysIn(ym))), amount: s.amount,
    cat: cat(s.category_id).id, label: s.name, shared: false, mine: true, paidByMe: true, auto: true
  })).filter(e => e.date <= t);
}

// Calcule tout le mois affiché
function calc(ym) {
  const exps = [...S.exps.filter(e => e.date.startsWith(ym)), ...subsFor(ym)].sort((a, b) => b.date.localeCompare(a.date) || (b.created_at || '').localeCompare(a.created_at || ''));
  const by = { none: 0 }; S.cats.forEach(c => by[c.id] = 0);
  const weeks = Array(Math.ceil(daysIn(ym) / 7)).fill(0);
  let spent = 0, h1 = 0, h2 = 0, sharedTotal = 0;
  exps.forEach(e => {
    const m = share(e), d = +e.date.slice(8);
    by[e.cat] = (by[e.cat] || 0) + m; spent += m;
    weeks[Math.floor((d - 1) / 7)] += m;
    d <= 15 ? h1 += m : h2 += m;
    if (e.shared) sharedTotal += e.amount;
  });
  const bud = { none: 0 }; S.cats.forEach(c => bud[c.id] = budgetFor(c, ym));
  const budget = S.cats.reduce((s, c) => s + bud[c.id], 0);
  const income = S.incs.filter(i => i.date.startsWith(ym)).reduce((s, i) => s + i.amount, 0);
  const contrib = S.contribs.filter(c => c.user_id === ME.id && c.date.startsWith(ym)).reduce((s, c) => s + c.amount, 0);
  const dim = daysIn(ym), t = todayStr(), cur = t.slice(0, 7);
  const elapsed = ym < cur ? dim : ym === cur ? +t.slice(8) : 0;
  return { ym, exps, by, bud, spent, budget, income, contrib, savings: income - spent, free: income - spent - contrib,
    weeks, h1, h2, dim, elapsed, avg: elapsed ? spent / elapsed : 0, sharedTotal };
}

// Solde cumulé avec le/la partenaire (> 0 : il/elle me doit)
function balance() {
  let b = 0;
  S.exps.forEach(e => { if (e.shared) b += e.paidByMe ? e.amount / 2 : -e.amount / 2; });
  S.setts.forEach(s => { b += s.from_user === ME.id ? s.amount : -s.amount; });
  return Math.round(b * 100) / 100;
}

// Alertes 50 % / 80 % (catégories fixes exclues), + total
function alertsFor(C) {
  const out = [];
  S.cats.forEach(c => { const b = C.bud[c.id]; if (b > 0 && !c.fixed) { const p = C.by[c.id] / b; if (p >= 0.5) out.push({ name: c.name, p }); } });
  if (C.budget > 0 && C.spent / C.budget >= 0.5) out.unshift({ name: 'Budget total', p: C.spent / C.budget });
  return out.sort((a, b) => b.p - a.p);
}

// ---------- Graphiques ----------
function ring(p) {
  const r = 52, c = 2 * Math.PI * r, v = Math.min(1, Math.max(0, p));
  return `<svg class="ring" viewBox="0 0 124 124" aria-hidden="true"><circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="12"/>
  <circle cx="62" cy="62" r="${r}" fill="none" stroke="${lvlColor(p)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 62 62)"/></svg>`;
}
function catBar(spent, budget, color) {
  const p = budget > 0 ? spent / budget : 0;
  return `<div class="bar"><i style="width:${Math.min(100, p * 100).toFixed(1)}%;background:${color}"></i><span class="m50"></span><span class="m80"></span></div>`;
}
function weekChart(C, compact) {
  const Wd = 320, H = compact ? 130 : 170, top = 22, bot = 24, n = C.weeks.length, gap = 14;
  const bw = (Wd - gap * (n + 1)) / n;
  const wb = C.weeks.map((_, i) => C.budget * (Math.min(C.dim, (i + 1) * 7) - i * 7) / C.dim);
  const max = Math.max(1, ...C.weeks, ...wb) * 1.12;
  const y = v => top + (H - top - bot) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Dépenses par semaine"><line x1="0" x2="${Wd}" y1="${H - bot}" y2="${H - bot}" stroke="var(--line)"/>`;
  C.weeks.forEach((v, i) => {
    const x = gap + i * (bw + gap);
    s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - bot - y(v))}" rx="7" fill="${v > wb[i] && C.budget ? 'var(--bad)' : 'var(--accent)'}"/>`;
    if (C.budget) s += `<line x1="${x - 3}" x2="${x + bw + 3}" y1="${y(wb[i])}" y2="${y(wb[i])}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".55"/>`;
    if (v) s += `<text x="${x + bw / 2}" y="${y(v) - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${Math.round(v)} €</text>`;
    s += `<text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="11" fill="var(--muted)">S${i + 1}</text>`;
  });
  return s + '</svg>';
}

// Tri : date ou montant, croissant ou décroissant (+ pertinence pour la recherche)
function sortBar(cur, withRel) {
  const [k, dir] = cur.split('-'), arrow = d => d === 'asc' ? '↑' : '↓';
  const btn = (key, label) => `<button data-act="sort" data-k="${key}" data-s="${withRel ? 1 : 0}" aria-pressed="${k === key}">${label}${k === key && key !== 'rel' ? ' ' + arrow(dir) : ''}</button>`;
  return `<div class="sortbar"><span class="small muted">Trier par</span>${withRel ? btn('rel', 'Pertinence') : ''}${btn('date', 'Date')}${btn('amt', 'Montant')}</div>`;
}
function sortItems(arr, mode, amt = x => x.amount) {
  const [k, dir] = mode.split('-'), sgn = dir === 'asc' ? 1 : -1;
  if (k === 'rel') return arr;
  return arr.slice().sort((a, b) => k === 'amt' ? sgn * (amt(a) - amt(b)) || b.date.localeCompare(a.date)
    : sgn * a.date.localeCompare(b.date) || sgn * (a.created_at || '').localeCompare(b.created_at || ''));
}
// Liste : en-têtes par jour si tri par date, sinon liste simple avec la date sur chaque ligne
function listHtml(arr, mode, row) {
  if (!mode.startsWith('date')) return arr.map(x => row(x, true)).join('');
  let html = '', last = '';
  arr.forEach(x => { if (x.date !== last) { html += `<div class="day-h">${dayLabel(x.date)}</div>`; last = x.date; } html += row(x, false); });
  return html;
}

  }
  if (UI.q.trim()) return `<div class="stack">${searchResults()}</div>`;   // (la barre de tri est incluse dans les résultats)
  const f = UI.filter, cf = UI.catFilter;
  // Filtre perso/communes puis filtre par catégorie
  const list = sortItems(C.exps.filter(e => (f === 'all' || (f === 'shared' ? e.shared : !e.shared)) && (cf === 'all' || e.cat === cf)), UI.sort, e => f === 'shared' ? e.amount : share(e));
  const usedCats = (C.by.none ? [...S.cats, NONE] : S.cats);
  const chips = `<div class="cat-chips" role="group" aria-label="Filtrer par catégorie"><button data-act="catf" data-v="all" aria-pressed="${cf === 'all'}">Toutes</button>${

// Courbe des dépenses cumulées sur le mois, comparée au rythme du budget
function cumChart(C) {
  const dim = C.dim, last = C.elapsed || 0, daily = Array(dim + 1).fill(0);
  C.exps.forEach(e => { daily[+e.date.slice(8)] += share(e); });
  const cum = [0]; for (let d = 1; d <= dim; d++) cum[d] = cum[d - 1] + daily[d];
  const Wd = 320, H = 180, L = 40, R = 12, T = 16, B = 26;
  const max = Math.max(C.budget, cum[Math.max(1, last)] || 0, 1) * 1.1;
  const x = d => L + (Wd - L - R) * (d / dim), y = v => T + (H - T - B) * (1 - v / max);
  const step = max > 2000 ? 1000 : max > 800 ? 250 : max > 300 ? 100 : 50;
  let s = `<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Dépenses cumulées sur le mois">`;
  for (let v = 0; v <= max; v += step) s += `<line x1="${L}" x2="${Wd - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v ? .6 : 1}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v >= 1000 ? (v / 1000).toLocaleString('fr-FR') + ' k' : v}</text>`;
  [1, 10, 20, dim].forEach(d => s += `<text x="${x(d)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d}</text>`);
  if (C.budget) s += `<line x1="${x(0)}" y1="${y(0)}" x2="${x(dim)}" y2="${y(C.budget)}" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="4 4" opacity=".45"/><text x="${x(dim * .55) + 6}" y="${y(C.budget * .55) + 14}" text-anchor="start" font-size="10" fill="var(--muted)">rythme du budget (${eur(C.budget)})</text>`;
  if (last) {
    const pts = []; for (let d = 0; d <= last; d++) pts.push(x(d).toFixed(1) + ',' + y(cum[d]).toFixed(1));
    const over = C.budget && cum[last] > C.budget * last / dim;
    const colr = over ? 'var(--bad)' : 'var(--accent)';
    s += `<polygon points="${x(0)},${y(0)} ${pts.join(' ')} ${x(last)},${y(0)}" fill="${colr}" opacity=".12"/><polyline points="${pts.join(' ')}" fill="none" stroke="${colr}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    s += `<circle cx="${x(last)}" cy="${y(cum[last])}" r="4.5" fill="${colr}" stroke="var(--surface)" stroke-width="2"/>`;
    const lx = Math.min(x(last), Wd - R - 4), anchor = x(last) > Wd * .7 ? 'end' : 'start';
    s += `<text x="${anchor === 'end' ? lx - 8 : lx + 8}" y="${y(cum[last]) - 8}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="var(--ink)">${eur(cum[last])}</text>`;
  }
  s += '</svg>';
  let txt = '';
  if (last && C.budget) {
    const ideal = C.budget * last / dim, diff = cum[last] - ideal;
    txt = last >= dim ? (cum[dim] <= C.budget ? `Mois terminé <b>${eur(C.budget - cum[dim])} sous le budget</b>.` : `Mois terminé <b>${eur(cum[dim] - C.budget)} au-dessus du budget</b>.`)
      : Math.abs(diff) < 1 ? 'Tu es pile au rythme de ton budget.' : diff > 0 ? `Au ${last}, tu as dépensé <b>${eur(diff)} de plus</b> que le rythme régulier de ton budget : ralentis un peu.` : `Au ${last}, tu as dépensé <b>${eur(-diff)} de moins</b> que le rythme régulier de ton budget.`;
  }
  return s + (txt ? `<p class="small" style="margin:8px 0 0">${txt}</p>` : '') + '<p class="small muted" style="margin:4px 0 0">Pointillés : rythme régulier du budget. Les dépenses fixes (loyer…) font monter la courbe d’un coup.</p>';
}
// Plan d'épargne d'une cagnotte avec date objectif

// Camembert (anneau) : parts par catégorie, total au centre, légende avec montants et pourcentages

    cum += len; return el;

// Bilan d'un mois, comparé au mois précédent
function bilanSheet(ym) {
  const C = calc(ym), P = calc(shiftMonth(ym, -1)), pm = shiftMonth(ym, -1);
  const hasP = P.spent > 0 || P.income > 0;
  const arrow = (a, b, lowerIsGood = true) => {
    if (!hasP || !b) return '<span class="muted">–</span>';
    const d = (a - b) / b, good = lowerIsGood ? d <= 0 : d >= 0;
    if (Math.abs(d) < .005) return '<span class="muted">=</span>';
    return `<span class="cmp ${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(Math.round(d * 100))} %</span>`;
  };
  const cats = (C.by.none ? [...S.cats, NONE] : S.cats).map(c => ({ c, s: C.by[c.id] || 0, p: P.by[c.id] || 0, b: C.bud[c.id] || 0 })).filter(x => x.s || x.p || x.b);
  const overs = cats.filter(x => x.b && !x.c.fixed && x.s > x.b).sort((a, b) => (b.s - b.b) - (a.s - a.b));
  const goods = cats.filter(x => x.b && !x.c.fixed && x.s <= x.b).sort((a, b) => (b.b - b.s) - (a.b - a.s));
  const ok = C.budget ? C.spent <= C.budget : null;
  const pots = S.pots.filter(p => p.user_id === ME.id || p.shared);
  const verse = C.free > 0 && pots.length ? `<button class="btn primary full" style="margin-top:6px" data-act="bilanVerse" data-v="${ym}">Verser ${eur(Math.floor(C.free))} d’épargne libre dans une cagnotte</button>` : '';
  if (ym === shiftMonth(todayStr().slice(0, 7), -1) && S.bilanSeen !== ym) { S.bilanSeen = ym; saveSettings(true); }
  openSheet(`Bilan ${deMonth(ym)} ${ym.slice(0, 4)}`, `
    <div class="bilan-hero"><span class="label">Mis de côté</span><b class="num" style="color:${C.savings < 0 ? 'var(--bad)' : 'var(--good)'}">${eur(C.savings)}</b>
      <span class="small muted num">${eur(C.income)} de revenus − ${eur(C.spent)} de dépenses ${hasP ? '· ' + monthName(pm) + ' : ' + eur(P.savings) : ''}</span></div>
    <div class="split" style="margin:12px 0">
      <div class="box"><span class="small muted">Budget</span><b class="num" style="color:${ok === false ? 'var(--bad)' : 'var(--good)'}">${ok === null ? '–' : ok ? 'Respecté' : 'Dépassé'}</b><span class="small muted num">${eur(C.spent)} / ${eur(C.budget)}</span></div>
      <div class="box"><span class="small muted">Moyenne / jour</span><b class="num">${eur(C.spent / C.dim)}</b><span class="small num">${hasP ? arrow(C.spent, P.spent) + ' vs ' + monthName(pm) : 'pas de données en ' + monthName(pm)}</span></div></div>
    ${overs.length ? `<div class="alert red" style="margin-bottom:8px"><span>Plus gros dépassement : <b>${esc(overs[0].c.name)}</b>, ${eur(overs[0].s - overs[0].b)} au-dessus</span></div>` : ''}
    ${goods.length ? `<div class="alert ok" style="margin-bottom:12px"><span>Meilleure maîtrise : <b>${esc(goods[0].c.name)}</b>, ${eur(goods[0].b - goods[0].s)} sous le budget</span></div>` : ''}
    <div class="tbl-wrap"><table><thead><tr><th>Catégorie</th><th>Dépensé</th><th>Budget</th><th>vs ${esc(monthName(pm).slice(0, 4))}.</th></tr></thead><tbody>
      ${cats.map(x => `<tr><td><span class="cat-name"><i class="dot" style="background:${col(x.c)}"></i>${esc(x.c.name)}</span></td><td class="${x.b && !x.c.fixed && x.s > x.b ? 'pct red' : ''}">${eur(x.s)}</td><td>${x.b ? eur(x.b) : '–'}</td><td>${arrow(x.s, x.p)}</td></tr>`).join('')}
      <tr><td><b>Total</b></td><td><b>${eur(C.spent)}</b></td><td><b>${eur(C.budget)}</b></td><td>${arrow(C.spent, P.spent)}</td></tr></tbody></table></div>
    ${C.sharedTotal ? `<p class="small muted" style="margin:10px 0 0">Dépenses communes : ${eur(C.sharedTotal)} à deux, dont ta moitié ${eur(C.sharedTotal / 2)}.</p>` : ''}
    ${verse}<button type="button" class="btn ghost full" style="margin-top:10px" data-act="close">Fermer</button>`, null);
}

  el.dataset.sure = 1; el.classList.add('sure'); el.innerHTML = TRASH + '<span>Toucher encore pour confirmer</span>';
  clearTimeout(el._t); el._t = setTimeout(() => { if (!el.isConnected) return; delete el.dataset.sure; el.classList.remove('sure'); el.innerHTML = TRASH + `<span>Supprimer ${el.dataset.what}</span>`; }, 4000);
}
function addCat() {
  const used = S.cats.map(c => c.color), color = [1, 2, 3, 4, 5, 6, 7, 8].find(n => !used.includes(n)) || 8;

    <div class="field"><span>Budget mensuel</span><input class="inp num" id="c-budget" name="budget" inputmode="decimal" placeholder="0"></div>
    <div class="field"><span>Couleur</span><div class="choices">${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<label><input type="radio" name="color" value="${n}" ${n === color ? 'checked' : ''}><span><i class="dot" style="background:var(--c${n});width:16px;height:16px"></i></span></label>`).join('')}</div></div>

function addSub() {

function confirmSheet(title, text, btn, fn) {

}
async function saveSettings(silent) {
  const q = sb.from('profiles').update({ settings: { widgets: S.widgets, hidden: S.hidden, bilanSeen: S.bilanSeen, clIgnored: (S.clIgnored || []).filter(id => S.exps.some(e => e.id === id)) } }).eq('id', ME.id);
  if (silent) { if (navigator.onLine) await q; return; }
  await db(q);
}

// ---------- Actions ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': if (UI.tab === el.dataset.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); break; } UI.tab = el.dataset.tab; UI.editHome = false; window.scrollTo(0, 0); render('fade'); break;
    case 'prev': UI.ym = shiftMonth(UI.ym, -1); render('right'); break;
    case 'next': UI.ym = shiftMonth(UI.ym, 1); render('left'); break;
    case 'add': addExpense(); break;
    case 'close': closeSheet(); render(); break;
    case 'exp': { const x = S.exps.find(y => y.id === id); if (x && x.mine && !x.pending && x.cat === 'none' && !(S.clIgnored || []).includes(id)) classify(id); else showExpense(id, el.dataset.ym); break; }
    case 'delExp':
      if (el.dataset.sure) { closeSheet(); db(sb.from('expenses').delete().eq('id', id), 'Dépense supprimée', () => { S.exps = S.exps.filter(x => x.id !== id); }); }
      else armDelete(el); break;
    case 'inc': editIncome(id); break;
    case 'delInc':
      if (el.dataset.sure) { closeSheet(); db(sb.from('incomes').delete().eq('id', id), 'Revenu supprimé', () => { S.incs = S.incs.filter(x => x.id !== id); }); }
      else armDelete(el); break;
    case 'dropPending': setOutbox(outbox().filter(o => o.tmp !== id)); applyOutbox(); closeSheet(); render(); toast('Saisie annulée'); break;
    case 'catMenu': catMenu(id); break;
    case 'editPot': editPot(id); break;
    case 'bilan': bilanSheet(el.dataset.v); render(); break;
    case 'bilanVerse': bilanVerse(el.dataset.v); break;
    case 'setts': settsSheet(); break;
    case 'settDel':
      if (el.dataset.sure) { closeSheet(); db(sb.from('settlements').delete().eq('id', id), 'Remboursement annulé'); }
      else { el.dataset.sure = 1; el.textContent = '✓'; el.setAttribute('aria-label', 'Confirmer l’annulation'); toast('Touche à nouveau pour annuler ce remboursement'); } break;
    case 'qclear': UI.q = ''; $('q').value = ''; $('qclear').hidden = true; render('soft'); break;
    case 'filter': UI.filter = el.dataset.v; render('soft'); break;
    case 'sort': {
      // Toucher le tri actif inverse le sens ; toucher un autre tri le sélectionne (décroissant d'abord)
      const key = el.dataset.k, isS = el.dataset.s === '1', cur = isS ? UI.sortSearch : UI.sort;
      const next = key === 'rel' ? 'rel' : cur.startsWith(key + '-') ? key + '-' + (cur.endsWith('desc') ? 'asc' : 'desc') : key + '-desc';
      if (isS) UI.sortSearch = next; else UI.sort = next;
      render('soft'); break;
    }
    case 'catf': UI.catFilter = el.dataset.v; render('soft'); break;
    case 'catgo': UI.tab = 'list'; UI.listMode = 'exp'; UI.filter = 'all'; UI.catFilter = id; window.scrollTo(0, 0); render('fade'); break;
    case 'mode': UI.listMode = el.dataset.v; render('soft'); break;
    case 'shared': UI.tab = 'list'; UI.listMode = 'exp'; UI.filter = 'shared'; UI.catFilter = 'all'; window.scrollTo(0, 0); render('fade'); break;
    case 'addInc': addIncome(); break;
    case 'addCat': addCat(); break;
    case 'addSub': addSub(); break;
    case 'addPot': addPot(); break;
    case 'contrib': contrib(id); break;
    case 'potDel': { const p = S.pots.find(x => x.id === id); confirmSheet('Supprimer la cagnotte ?', `« ${esc(p.name)} » et ses ${eur(potTotal(p))} de versements seront retirés.`, 'Supprimer', () => db(sb.from('pots').delete().eq('id', id), 'Cagnotte supprimée')); break; }
    case 'catDel': { const c = cat(id); confirmSheet('Supprimer « ' + esc(c.name) + ' » ?', 'Les dépenses déjà saisies dans cette catégorie apparaîtront comme « Sans catégorie ».', 'Supprimer', () => db(sb.from('categories').delete().eq('id', id), 'Catégorie supprimée')); break; }
    case 'subDel': db(sb.from('subscriptions').delete().eq('id', id), 'Abonnement supprimé'); break;
    case 'settle': {
      const b = balance(), amount = Math.abs(b);
      const row = b < 0 ? { from_user: ME.id, to_user: S.pid, amount } : { from_user: S.pid, to_user: ME.id, amount };
      confirmSheet('On est quittes ?', b < 0 ? `Tu as remboursé <b>${eur(amount)}</b> à ${esc(partnerName())}.` : `${esc(partnerName())} t’a remboursé <b>${eur(amount)}</b>.`, 'Valider',
        () => db(sb.from('settlements').insert(row), 'Solde remis à zéro'));
      $('sheetOk').className = 'btn primary'; break;
    }
    case 'editHome': UI.editHome = !UI.editHome; window.scrollTo(0, 0); render('fade'); break;
    case 'wmove': { const i = +el.dataset.i, j = i + +el.dataset.d; [S.widgets[i], S.widgets[j]] = [S.widgets[j], S.widgets[i]]; render(); saveSettings(true);
      const rows = document.querySelectorAll('.edit-row'); [rows[i], rows[j]].forEach(r => r && r.classList.add('moved')); break; }
    case 'wtoggle': { const k = el.dataset.k; S.hidden = S.hidden.includes(k) ? S.hidden.filter(x => x !== k) : [...S.hidden, k]; render(); saveSettings(true); break; }
    case 'kind': setKind(el.dataset.v); break;
    case 'donut': donutSelect(id); break;
    case 'toClassify': classify(); break;
    case 'clPick': clPick(id, el.dataset.v); break;
    case 'clSkip': classify(id); break;
    case 'clIgnore': {
      // Reste « Sans catégorie », mais n'est plus proposée au classement
      const next = toClassifyList().filter(x => x.id !== id)[0];
      S.clIgnored = [...(S.clIgnored || []), id]; saveSettings(true);
      toast('Ignorée : elle reste dans « Sans catégorie »'); classify(next && next.id); break;
    }
    case 'clDel':
      if (el.dataset.sure) {
        const next = toClassifyList().filter(x => x.id !== id)[0];
        db(sb.from('expenses').delete().eq('id', id), 'Dépense supprimée', () => { S.exps = S.exps.filter(x => x.id !== id); }).then(ok => { if (ok) classify(next && next.id); });
      } else armDelete(el); break;
    case 'showToken': sb.rpc('my_quick_token').then(({ data, error }) => {
      if (error || !data) { toast('Jeton indisponible : as-tu exécuté le script Apple Pay dans Supabase ?'); return; }
      const box = $('tokenBox'); box.hidden = false; box.textContent = data;
      navigator.clipboard?.writeText(data).then(() => toast('Jeton copié'), () => toast('Sélectionne le jeton pour le copier'));
    }); break;
    case 'regenToken':
      if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = 'Confirmer (l’ancien raccourci ne marchera plus)'; break; }
      sb.rpc('regen_quick_token').then(({ data, error }) => {
        if (error || !data) { toast('Erreur : ' + (error?.message || 'jeton non généré')); return; }
        const box = $('tokenBox'); box.hidden = false; box.textContent = data;
        el.textContent = 'Changer de jeton'; delete el.dataset.sure;
        navigator.clipboard?.writeText(data).then(() => toast('Nouveau jeton copié : mets-le à jour dans ton raccourci'), () => toast('Nouveau jeton créé : mets-le à jour dans ton raccourci'));
      }); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({ exporte_le: new Date().toISOString(), ...S }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = 'carnet-budget-' + todayStr() + '.json'; link.click(); setTimeout(() => URL.revokeObjectURL(url), 2000); break;
    }
    case 'logout': sb.auth.signOut(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.act;
  if (a === 'recat') {
    // Range cette dépense, et les autres dépenses non classées chez le même commerçant

    (async () => {
      if (e && e.label) await sb.from('expenses').update(upd).eq('user_id', ME.id).is('category_id', null).eq('label', e.label);
      await db(sb.from('expenses').update(upd).eq('id', el.dataset.id), 'Rangée dans ' + c.name);
    })();

  if (a === 'reshare') db(sb.from('expenses').update({ shared: el.checked }).eq('id', el.dataset.id), el.checked ? 'Passée en dépense commune' : 'Repassée en dépense perso');
  if (a === 'budget') {

  }
  if (a === 'fixed') { const v = el.checked; db(sb.from('categories').update({ fixed: v }).eq('id', el.dataset.id), v ? 'Catégorie fixe : plus d’alerte' : 'Alertes réactivées', () => { cat(el.dataset.id).fixed = v; }); }
  if (a === 'pname') db(sb.from('profiles').update({ name: el.value.trim() }).eq('id', ME.id), 'Prénom enregistré');
  if (a === 'pemail') db(sb.from('profiles').update({ partner_email: el.value.trim().toLowerCase() || null }).eq('id', ME.id), 'Email enregistré');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// Glisser la fenêtre vers le bas pour la fermer (depuis la poignée, ou n'importe où quand le contenu est tout en haut)
let suppressClick = false;
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
(function sheetDrag() {
  const sh = $('sheet'), sc = $('scrim');
  let y0 = null, dy = 0, t0 = 0, drag = false, fromGrip = false;
  const start = (y, target) => {
    if (sh.hidden || sh.classList.contains('closing')) return;
    fromGrip = !!target.closest('.grip-zone');
    if (!fromGrip && (sh.scrollTop > 0 || target.closest('input,textarea,select,.cat-chips'))) return;
    y0 = y; dy = 0; t0 = Date.now(); drag = false;
  };
  const move = (y, e) => {
    if (y0 === null) return;
    dy = y - y0;
    if (!drag) {
      if (dy > 8) { drag = true; sh.style.animation = 'none'; sh.style.transition = 'none'; sc.style.transition = 'none'; }
      else if (dy < -4 && !fromGrip) { y0 = null; return; }   // vers le haut : défilement normal
      else return;
    }
    if (e.cancelable) e.preventDefault();
    const d = Math.max(0, dy) * (dy > 0 ? 1 : 0);
    sh.style.transform = `translateY(${d}px)`;
    sc.style.opacity = String(Math.max(0, 1 - d / Math.max(300, sh.offsetHeight)));
  };
  const end = () => {
    if (y0 === null) return;
    const v = dy / Math.max(1, Date.now() - t0); y0 = null;
    if (!drag) return;
    drag = false; suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
    if (dy > Math.min(140, sh.offsetHeight * .3) || v > .6) {
      sh.style.transition = 'transform .26s cubic-bezier(.3,.6,.4,1)'; sc.style.transition = 'opacity .26s ease';
      sh.style.transform = 'translateY(100%)'; sc.style.opacity = '0';
      onSubmit = null;
      clearTimeout(sheetT); sheetT = setTimeout(() => {
        sh.hidden = true; sc.hidden = true; ['transform', 'transition', 'animation'].forEach(p => sh.style[p] = ''); sc.style.opacity = ''; sc.style.transition = '';
        render();
      }, 260);
    } else {
      sh.style.transition = 'transform .38s cubic-bezier(.2,.9,.25,1)'; sc.style.transition = 'opacity .3s ease';
      sh.style.transform = ''; sc.style.opacity = '';
      setTimeout(() => { sh.style.transition = ''; sc.style.transition = ''; }, 400);
    }
  };
  sh.addEventListener('touchstart', e => start(e.touches[0].clientY, e.target), { passive: true });
  sh.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
  sh.addEventListener('mousedown', e => {
    if (!e.target.closest('.grip-zone')) return;
    start(e.clientY, e.target);
    const mm = ev => move(ev.clientY, ev), mu = () => { end(); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };
    addEventListener('mousemove', mm); addEventListener('mouseup', mu);
  });
})();
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  if (!UI.q.trim()) UI.sortSearch = 'rel';
  UI.q = e.target.value; $('qclear').hidden = !UI.q;
  clearTimeout(window._qT); window._qT = setTimeout(() => render(), 120);   // petite pause pour ne pas recalculer à chaque lettre
});
// Réseau : envoi de la file d'attente au retour de la connexion
window.addEventListener('online', () => { if (ME && S && sb) { flush(); refresh(); } });
window.addEventListener('offline', () => { if (S) { UI.offline = true; render(); } });
// Recharge en revenant sur l'appli (pour voir les dépenses communes ajoutées par l'autre)
document.addEventListener('visibilitychange', () => { if (!document.hidden && ME && S && sb) { flush(); refresh(); } });

// ---------- Connexion ----------
let signup = false;
$('authSwitch').addEventListener('click', () => {
  signup = !signup;
  $('nameField').hidden = !signup;
  $('authBtn').textContent = signup ? 'Créer mon compte' : 'Se connecter';
  $('authSwitch').textContent = signup ? 'J’ai déjà un compte' : 'Pas encore de compte ? Créer un compte';
  $('authHint').textContent = signup ? 'Crée ton compte avec ton email.' : 'Connecte-toi pour retrouver ton budget.';
  $('a-pass').autocomplete = signup ? 'new-password' : 'current-password';
});
$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target), email = fd.get('email').trim(), password = fd.get('password');
  $('authBtn').disabled = true;
  const { error } = signup
    ? await sb.auth.signUp({ email, password, options: { data: { name: (fd.get('name') || '').trim() } } })
    : await sb.auth.signInWithPassword({ email, password });
  $('authBtn').disabled = false;
  if (error) toast(error.message.includes('Invalid login') ? 'Email ou mot de passe incorrect' : error.message.includes('not allowed') || error.message.includes('disabled') ? 'Les inscriptions sont fermées' : 'Erreur : ' + error.message);
});

// Copie locale des données (dernière connexion)
function fromCache(uid, quiet) {
  try { const c = JSON.parse(localStorage.getItem(CACHE)); if (c && c.uid === uid && c.S) { S = c.S; UI.offline = !quiet; applyOutbox(); return true; } } catch (e) {}
  return false;
}
const showShell = () => { $('loading').hidden = true; $('auth').hidden = true; $('shell').hidden = false; };
async function showApp() {
  // 1. Affichage immédiat de la dernière copie enregistrée sur le téléphone
  const cached = fromCache(ME.id, true);
  if (cached) { showShell(); render('fade'); }
  // 2. Données fraîches en arrière-plan
  try { await load(); }
  catch (err) {
    if (!cached && !fromCache(ME.id)) { $('loading').textContent = 'Pas de réseau et aucune donnée enregistrée sur ce téléphone. Réessaie une fois connecté.'; return; }
    UI.offline = true;
  }
  showShell(); render(cached ? undefined : 'fade'); flush();
}
function showAuth() { if (UI.offline && S) return; ME = null; S = null; closeSheet(); $('loading').hidden = true; $('shell').hidden = true; $('auth').hidden = false; }

if (SUPABASE_URL.startsWith('COLLE')) {
  $('loading').textContent = 'Configuration manquante : colle la Project URL et la clé anon en haut du fichier index.html.';
} else if (typeof supabase === 'undefined') {
  // Bibliothèque non chargée (hors ligne au premier lancement) : on affiche la copie locale si elle existe
  try { const c = JSON.parse(localStorage.getItem(CACHE)); if (c) { ME = { id: c.uid }; fromCache(c.uid); $('loading').hidden = true; $('shell').hidden = false; render(); } else $('loading').textContent = 'Pas de réseau. Réessaie une fois connecté.'; } catch (e) {}
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  // Hors ligne : affichage immédiat de la dernière copie, sans attendre la connexion
  if (!navigator.onLine) { try { const c = JSON.parse(localStorage.getItem(CACHE)); if (c && fromCache(c.uid)) { ME = { id: c.uid }; $('loading').hidden = true; $('auth').hidden = true; $('shell').hidden = false; render(); } } catch (e) {} }
  sb.auth.onAuthStateChange((event, session) => {
    const u = session?.user || null;
    if (u && (!ME || ME.id !== u.id || !ME.email)) { const same = ME && ME.id === u.id; ME = u; if (same) { flush(); refresh(); } else setTimeout(showApp, 0); }
    else if (!u) showAuth();
  });
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
